# KSC2026 RocksDB/YCSB-A experiment: RocksDB options file (RocksDB 11.8.1, read by the YCSB rocksdb binding).
# run_rocksdb_ycsb.sh replaces 16384 (bytes) and saves the concrete file as <run dir>/rocksdb_options.ini.
# Options not listed keep the RocksDB 11.8.1 defaults (the DB writes the full effective set to OPTIONS-* and LOG).
# YCSB keeps its records in the column family "usertable", so that section is required.
[Version]
  rocksdb_version=11.8.1
  options_file_version=1.1

[DBOptions]
  create_if_missing=true
  create_missing_column_families=true
  # data reads and flush/compaction writes bypass the page cache (host RAM 11.45 GiB > device 11.2 GiB);
  # the WAL is still written through the page cache (RocksDB default), without fsync per write (rocksdb.sync=false);
  # RocksDB does fsync the closed WAL files before each memtable flush, because the DB has 2 column families
  # (default + usertable; db_impl_compaction_flush.cc needs_to_sync_closed_wals)
  use_direct_reads=true
  use_direct_io_for_flush_and_compaction=true
  max_background_jobs=2
  # compaction statistics in LOG every 60 s (default 600 s)
  stats_dump_period_sec=60

[CFOptions "default"]
  compression=kNoCompression

[TableOptions/BlockBasedTable "default"]
  block_size=16384
  block_cache=8388608

[CFOptions "usertable"]
  compression=kNoCompression

[TableOptions/BlockBasedTable "usertable"]
  block_size=16384
  block_cache=8388608
